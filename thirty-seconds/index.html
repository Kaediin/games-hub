<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4a1c28" />
    <title>30 Seconds — Vineyard Race</title>
    <meta
      name="description"
      content="A free, browser-based version of 30 Seconds. Teams race a vineyard path. No backend."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <a href="#home" class="brand" aria-label="30 Seconds home">
        <span class="brand-mark" aria-hidden="true">30</span>
        <span class="brand-text">Seconds</span>
      </a>
      <nav class="header-actions" aria-label="App controls">
        <div
          id="timer-chip"
          class="timer-chip hidden"
          role="status"
          aria-live="polite"
        ></div>
        <button
          id="btn-sound"
          class="icon-btn"
          type="button"
          aria-label="Toggle sound"
          aria-pressed="false"
          title="Toggle sound"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              class="ico-sound-on"
              fill="currentColor"
              d="M3 10v4h4l5 4V6L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
            />
            <path
              class="ico-sound-off hidden"
              fill="currentColor"
              d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.17v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"
            />
          </svg>
        </button>
        <button
          id="btn-theme"
          class="icon-btn"
          type="button"
          aria-label="Toggle theme"
          title="Toggle theme"
        >
          <svg
            class="ico-theme-light"
            viewBox="0 0 24 24"
            width="22"
            height="22"
            aria-hidden="true"
          >
            <path
              fill="currentColor"
              d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 17a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1zM4.22 4.22a1 1 0 0 1 1.42 0l1.42 1.42A1 1 0 1 1 5.64 7.06L4.22 5.64a1 1 0 0 1 0-1.42zm12.72 12.72a1 1 0 0 1 1.42 0l1.42 1.42a1 1 0 1 1-1.42 1.42l-1.42-1.42a1 1 0 0 1 0-1.42zM2 12a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1zm17 0a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2h-2a1 1 0 0 1-1-1zM4.22 19.78a1 1 0 0 1 0-1.42l1.42-1.42a1 1 0 1 1 1.42 1.42l-1.42 1.42a1 1 0 0 1-1.42 0zm12.72-12.72a1 1 0 0 1 0-1.42l1.42-1.42a1 1 0 0 1 1.42 1.42l-1.42 1.42a1 1 0 0 1-1.42 0z"
            />
          </svg>
          <svg
            class="ico-theme-dark hidden"
            viewBox="0 0 24 24"
            width="22"
            height="22"
            aria-hidden="true"
          >
            <path
              fill="currentColor"
              d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"
            />
          </svg>
        </button>
      </nav>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <template id="tpl-home">
      <section class="home">
        <div class="hero">
          <p class="eyebrow">Vineyard race · party classic</p>
          <h1 class="hero-title">30 Seconds</h1>
          <p class="hero-tagline">
            Five words. Half a minute. First team to the château wins.
          </p>
          <div class="hero-actions">
            <button class="btn btn-primary" data-action="new-game">New game</button>
            <button class="btn btn-secondary hidden" data-action="resume-game">
              Resume game
            </button>
            <button class="btn btn-ghost" data-action="history">Game history</button>
          </div>
        </div>

        <section class="card">
          <h2>What is 30 Seconds?</h2>
          <p>
            A fast team party game. One person describes five words, names or
            titles. Teammates shout guesses. You have
            <strong>30 seconds</strong>. Each correct word moves you one space
            along the vineyard path. First pawn to the château wins.
          </p>
        </section>

        <section class="card">
          <h2>How to play</h2>
          <ol class="how-list">
            <li>
              Split into <strong>2–4 teams</strong>. The describer holds this
              device (an iPad is perfect). Everyone else looks away from the
              screen.
            </li>
            <li>
              Mix word packs (Dutch, English, films, music, sports, Hollandse
              cultuur) — a card can mix languages. Optional: peek at the five
              words, then tap <strong>GO</strong>.
            </li>
            <li>
              Describe the words in <strong>any order</strong>. Tap a word when
              it is guessed. You may not say the word (or part of it), first
              letters, “sounds like”, or a translation.
            </li>
            <li>
              The last five seconds <strong>tick</strong>. When time is up,
              advance one space per correct word. Reaching or passing the
              château wins — no exact landing needed.
            </li>
            <li>
              Rotate who describes. Race the winding vineyard from the cellar
              to the château.
            </li>
          </ol>
        </section>

        <section class="card">
          <h2>How it works · your data</h2>
          <p>
            Everything runs in your browser. There is
            <strong>no backend</strong>, no account, no tracking. Team names,
            the current game and history stay in this browser’s
            <strong>local&nbsp;storage</strong>. Clearing browser data wipes
            everything.
          </p>
        </section>

        <section class="card">
          <h2>Tips</h2>
          <ul class="tip-list">
            <li>Best with 2+ players per team so someone can guess.</li>
            <li>Add player names if you want the app to rotate describers.</li>
            <li>Turn sound on so the whole table hears the last-five-seconds tick.</li>
            <li>Refresh-safe: the game survives reloads.</li>
          </ul>
        </section>

        <footer class="home-footer">
          <p>
            Inspired by
            <a
              href="https://en.wikipedia.org/wiki/30_Seconds_(game)"
              target="_blank"
              rel="noopener noreferrer"
              >30 Seconds</a
            >
            by Calie Esterhuyse. This is an unofficial fan-made web version.
            Word lists are original and not copied from any commercial deck.
          </p>
          <button class="btn btn-danger-ghost" data-action="reset-data">
            Reset all data
          </button>
        </footer>
      </section>
    </template>

    <template id="tpl-setup">
      <section class="setup">
        <a href="#home" class="back-link">← Back</a>
        <h1>Set up the race</h1>
        <p class="muted">
          Two to four teams, mix the packs, then hand the iPad to the first
          describer.
        </p>

        <h2 class="section-label">Teams</h2>
        <div id="teams-editor" class="teams-editor"></div>
        <button id="add-team" class="btn btn-secondary" type="button">
          Add a team
        </button>

        <h2 class="section-label">Word packs</h2>
        <p class="muted" id="pool-hint"></p>
        <div id="pack-list" class="pack-list"></div>

        <label class="field-label" for="custom-words">Custom words (one per line)</label>
        <textarea
          id="custom-words"
          rows="4"
          placeholder="Inside jokes, colleagues, the dog’s name…"
        ></textarea>

        <h2 class="section-label">Round options</h2>
        <label class="check-row" for="opt-peek">
          <input id="opt-peek" type="checkbox" checked />
          <span>
            Peek before the timer
            <em>Describer sees the five words, then taps GO.</em>
          </span>
        </label>
        <p class="field-label">Timer</p>
        <div id="timer-presets" class="chip-row"></div>

        <div class="setup-actions">
          <button id="reset-setup" class="btn btn-ghost" type="button">
            Reset setup
          </button>
          <button id="start-game" class="btn btn-primary" type="button">
            Start race →
          </button>
        </div>
      </section>
    </template>

    <template id="tpl-board">
      <section class="board-view">
        <div class="turn-banner" id="turn-banner">
          <div>
            <p class="eyebrow">Now describing</p>
            <h1 id="turn-team">Team</h1>
            <p id="turn-detail" class="muted"></p>
          </div>
          <button id="start-round" class="btn btn-primary" type="button">
            Start round
          </button>
        </div>
        <div class="map-wrap">
          <svg id="vineyard" class="vineyard" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vineyard race map"></svg>
        </div>
        <ul id="standings" class="standings"></ul>
        <footer class="play-actions">
          <button id="quit-game" class="btn btn-danger-ghost" type="button">
            Quit game
          </button>
        </footer>
      </section>
    </template>

    <template id="tpl-round">
      <section class="round">
        <header class="round-head">
          <p class="eyebrow" id="round-who">Describe these five</p>
          <h1 id="round-team">Team</h1>
        </header>
        <div id="round-timer" class="round-timer" aria-live="polite">30</div>
        <div id="countdown-overlay" class="countdown-overlay hidden" aria-hidden="true"></div>
        <div id="word-list" class="word-list"></div>
        <div class="round-actions">
          <button id="btn-go" class="btn btn-primary btn-go" type="button">
            GO
          </button>
          <button id="btn-pause" class="btn btn-ghost hidden" type="button">
            Pause
          </button>
          <button id="btn-finish-round" class="btn btn-secondary hidden" type="button">
            Advance
          </button>
        </div>
        <p class="round-hint muted">
          Tap a word when it is guessed. Tap again to undo. Any order is fine.
        </p>
      </section>
    </template>

    <template id="tpl-end">
      <section class="end-view">
        <p class="eyebrow">Race over</p>
        <h1 id="end-title">The château</h1>
        <p id="end-detail" class="muted"></p>
        <ul id="end-standings" class="end-standings"></ul>
        <div class="setup-actions">
          <button class="btn btn-primary" data-action="new-game">Play again</button>
          <button class="btn btn-ghost" data-action="home">Back to home</button>
        </div>
      </section>
    </template>

    <template id="tpl-history">
      <section class="history">
        <a href="#home" class="back-link">← Home</a>
        <h1>Game history</h1>
        <ul id="history-list" class="history-list"></ul>
        <p id="history-empty" class="muted hidden">
          No races finished yet. Win one and it’ll show up here.
        </p>
        <div class="setup-actions">
          <button id="clear-history" class="btn btn-danger-ghost">Clear history</button>
        </div>
      </section>
    </template>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
